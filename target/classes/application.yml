server:
  port: 8080

spring:
  application:
    name: treasury-api
  
  # R2DBC Configuration (Reactive PostgreSQL)
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/treasury_db
    username: treasury_user
    password: treasury_password_2024
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
  
  # JDBC Configuration (for Liquibase only)
  datasource:
    url: jdbc:postgresql://localhost:5432/treasury_db
    username: treasury_user
    password: treasury_password_2024
    driver-class-name: org.postgresql.Driver
  
  # Liquibase Configuration
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

logging:
  level:
    root: INFO
    com.rtcomops.treasury: DEBUG
    io.r2dbc.postgresql: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
