server:
  port: ${PORT:8080}  # Utilise $PORT si défini (Render), sinon 8080 en local

spring:
  application:
    name: treasury-api

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:treasury_db}?sslMode=require
    username: ${DB_USER:treasury_user}
    password: ${DB_PASSWORD:treasury_password_2024}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:treasury_db}
    username: ${DB_USER:treasury_user}
    password: ${DB_PASSWORD:treasury_password_2024}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

logging:
  level:
    root: INFO
    com.rtcomops.treasury: DEBUG
    io.r2dbc.postgresql: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
