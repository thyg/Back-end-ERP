# =============================================================================
# CONFIGURATION DE PRODUCTION - Render + Neon PostgreSQL
# =============================================================================
# IMPORTANT: Toutes les valeurs sensibles DOIVENT être définies via des
# variables d'environnement sur Render. Ne jamais commiter de credentials !
# =============================================================================

server:
  port: ${PORT:8080}

spring:
  # Désactiver Liquibase - les migrations seront exécutées manuellement ou via CI/CD
  liquibase:
    enabled: false

  # -------------------------------------------------------------------------
  # R2DBC - Connexion réactive à PostgreSQL (pour l'application)
  # -------------------------------------------------------------------------
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslMode=require&connectTimeout=PT30S
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      initial-size: 2
      max-size: 10
      max-idle-time: 30m
      max-create-connection-time: 30s
      validation-query: SELECT 1

  # -------------------------------------------------------------------------
  # JDBC DataSource - Désactivé (bug SCRAM avec Neon pooler)
  # Réactiver quand Neon corrigera le problème d'itération SCRAM < 4096
  # -------------------------------------------------------------------------
  # datasource:
  #   url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require&connectTimeout=30&socketTimeout=60&prepareThreshold=0
  #   username: ${DB_USER}
  #   password: ${DB_PASSWORD}
  #   driver-class-name: org.postgresql.Driver
  #   hikari:
  #     connection-timeout: 30000
  #     maximum-pool-size: 5
  #     minimum-idle: 1

# -----------------------------------------------------------------------------
# Swagger/OpenAPI - Activé en production
# -----------------------------------------------------------------------------
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# -----------------------------------------------------------------------------
# Logging optimisé pour la production
# -----------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.rtcomops.treasury: INFO
    org.springframework.r2dbc: WARN
    io.r2dbc.postgresql: WARN
    liquibase: INFO
